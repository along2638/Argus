<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>Argus — 数据看板</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="/static/theme.js"></script>
    <script src="/static/permissions.js"></script>
    <script src="/static/loading.js"></script>
    <style>
        :root{--bg:#f8f7f5;--bg-card:#fff;--bg-card-solid:#fff;--bg-input:#f5f4f2;--border:#e8e6e3;--ink:#1c1917;--ink-light:#44403c;--ink-muted:#78716c;--ink-faint:#a8a29e;--accent-soft:rgba(26,26,26,0.06);--success:#16a34a;--success-bg:rgba(45,122,79,0.08);--danger:#dc2626;--danger-bg:rgba(179,58,58,0.08);--warning:#d97706;--warning-bg:rgba(217,119,6,0.08);--radius:8px;--radius-md:12px;--radius-lg:16px;--shadow:0 1px 3px rgba(0,0,0,0.04),0 8px 32px rgba(0,0,0,0.06);--shadow-sm:0 1px 2px rgba(0,0,0,0.04);--transition:0.2s ease}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 30%,rgba(180,170,155,0.08) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 75% 60%,rgba(160,150,135,0.06) 0%,transparent 60%);pointer-events:none;z-index:0}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:3px}

        .app{position:relative;z-index:1;max-width:1800px;margin:0 auto;padding:0 32px 60px}
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid var(--border);margin-bottom:36px}
        .topbar-left{display:flex;align-items:center;gap:12px}
        .topbar-logo{width:34px;height:34px;background:var(--ink);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,0.15)}
        .topbar h1{font-size:1.15rem;font-weight:600;letter-spacing:-0.02em}
        .topbar-right{display:flex;align-items:center;gap:10px}
        .topbar-btn{color:var(--ink-muted);font-size:0.78rem;font-weight:500;text-decoration:none;padding:5px 10px;border-radius:6px;transition:var(--transition);border:none;background:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;letter-spacing:0.01em}
        .topbar-btn:hover{color:var(--ink);background:var(--bg-hover)}
        .topbar-btn.nav-active{color:var(--ink);background:var(--accent-soft);font-weight:600}
        .topbar-btn .nav-icon{width:14px;height:14px;opacity:0.55;flex-shrink:0}
        .topbar-btn:hover .nav-icon{opacity:0.8}
        .nav-sep{width:1px;height:16px;background:var(--border);margin:0 2px;flex-shrink:0;opacity:0.7}

        .main{position:relative;z-index:1;padding:0}

        .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
        .section-title{font-size:0.92rem;font-weight:600}

        .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center;backdrop-filter:blur(20px);transition:var(--transition)}
        .stat-card:hover{box-shadow:var(--shadow)}
        .stat-label{font-size:0.68rem;font-weight:500;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
        .stat-value{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
        .stat-value.green{color:var(--success)}.stat-value.red{color:var(--danger)}.stat-value.blue{color:#0891b2}.stat-value.yellow{color:var(--warning)}
        .stat-change{font-size:0.7rem;margin-top:4px;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px}
        .stat-change.up{color:var(--danger);background:var(--danger-bg)}
        .stat-change.down{color:var(--success);background:var(--success-bg)}
        .stat-change.neutral{color:var(--ink-muted);background:var(--accent-soft)}

        .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
        .chart-row.single{grid-template-columns:1fr}

        .chart-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);backdrop-filter:blur(20px);overflow:hidden}
        .chart-head{padding:16px 20px;border-bottom:1px solid var(--border);font-size:0.84rem;font-weight:600;display:flex;align-items:center;justify-content:space-between}
        .chart-head-right{display:flex;align-items:center;gap:8px}
        .chart-body{padding:20px;min-height:220px;position:relative}

        .range-btns{display:flex;gap:4px}
        .range-btn{padding:3px 10px;font-size:0.7rem;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--ink-muted);cursor:pointer;transition:var(--transition);font-family:inherit}
        .range-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
        .range-btn:hover:not(.active){border-color:var(--ink-faint)}

        .btn-sm{padding:4px 12px;font-size:0.72rem;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--ink-muted);cursor:pointer;transition:var(--transition);font-family:inherit;display:inline-flex;align-items:center;gap:4px}
        .btn-sm:hover{color:var(--ink);border-color:var(--ink-faint)}
        .btn-sm.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
        .btn-sm.primary:hover{opacity:0.9}

        /* Bar chart */
        .bar-chart{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:24px}
        .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
        .bar{width:100%;border-radius:3px 3px 0 0;transition:height 0.4s ease;min-height:2px;opacity:0.85;cursor:pointer}
        .bar:hover{opacity:1}
        .bar-label{font-size:0.68rem;color:var(--ink-muted);white-space:nowrap;font-family:'JetBrains Mono',monospace}
        .bar-value{font-size:0.72rem;font-weight:600;color:var(--ink-light)}
        .bar-tooltip{position:absolute;top:-8px;left:50%;transform:translateX(-50%) translateY(-100%);background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:var(--radius);font-size:0.7rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:10;font-family:'JetBrains Mono',monospace}
        .bar-col:hover .bar-tooltip{opacity:1}

        /* Donut chart */
        .donut-wrap{display:flex;align-items:center;justify-content:center;gap:32px;height:180px}
        .donut-legend{display:flex;flex-direction:column;gap:10px}
        .legend-item{display:flex;align-items:center;gap:10px;font-size:0.78rem;color:var(--ink-light)}
        .legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
        .legend-count{font-weight:600;margin-left:auto;padding-left:16px;color:var(--ink);font-family:'JetBrains Mono',monospace}

        /* Alarm table */
        .alarm-table{width:100%;border-collapse:collapse;font-size:0.78rem}
        .alarm-table th{text-align:left;padding:10px 16px;font-weight:600;color:var(--ink-muted);border-bottom:1px solid var(--border);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;user-select:none;white-space:nowrap}
        .alarm-table th:hover{color:var(--ink)}
        .alarm-table th .sort-icon{display:inline-block;margin-left:4px;opacity:0.3;font-size:0.6rem}
        .alarm-table th.sorted .sort-icon{opacity:1}
        .alarm-table td{padding:10px 16px;border-bottom:1px solid var(--border);color:var(--ink-light);vertical-align:middle}
        .alarm-table tr:last-child td{border-bottom:none}
        .alarm-table tr:hover td{background:var(--accent-soft)}
        .alarm-type-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:500}
        .alarm-type-badge.helmet{background:rgba(8,145,178,0.1);color:#0891b2}
        .alarm-type-badge.fire{background:rgba(179,58,58,0.1);color:#b33a3a}
        .alarm-type-badge.intrusion{background:rgba(166,124,0,0.1);color:#a67c00}
        .alarm-type-badge.person{background:rgba(45,122,79,0.1);color:#2d7a4f}
        .alarm-type-badge.animal{background:rgba(217,119,6,0.1);color:#d97706}
        .alarm-type-badge.smoke{background:rgba(230,126,34,0.1);color:#e67e22}
        .alarm-type-badge.no_helmet{background:rgba(8,145,178,0.1);color:#0891b2}
        .severity-badge{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:0.68rem;font-weight:500}
        .severity-badge.critical{background:rgba(220,38,38,0.1);color:#dc2626}
        .severity-badge.important{background:rgba(217,119,6,0.1);color:#d97706}
        .severity-badge.normal{background:var(--accent-soft);color:var(--ink-muted)}
        .alarm-time{font-family:'JetBrains Mono',monospace;color:var(--ink-muted);font-size:0.72rem}
        .alarm-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--border);cursor:pointer;transition:var(--transition)}
        .alarm-thumb:hover{transform:scale(1.1);box-shadow:var(--shadow)}

        /* Image preview tooltip */
        .img-preview{position:fixed;z-index:1000;border-radius:var(--radius-md);box-shadow:0 8px 32px rgba(0,0,0,0.2);border:2px solid var(--border);max-width:320px;max-height:240px;pointer-events:none;display:none;background:var(--bg-card-solid)}

        /* Empty state */
        .empty-state{text-align:center;padding:48px 20px;color:var(--ink-faint)}
        .bar-chart .empty-state{width:100%;align-self:center}
        .empty-icon{width:48px;height:48px;margin:0 auto 12px;opacity:0.4}
        .empty-text{font-size:0.82rem;margin-bottom:4px}
        .empty-hint{font-size:0.72rem;color:var(--ink-faint)}

        /* Severity bar */
        .severity-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:8px}
        .severity-bar div{transition:width 0.4s ease}

        .footer{text-align:center;padding:40px 0 0;color:var(--ink-faint);font-size:0.73rem}

        @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
        @media(max-width:1200px){.stats-row{grid-template-columns:repeat(2,1fr)}.chart-row{grid-template-columns:1fr}}
        @media(max-width:640px){.stats-row{grid-template-columns:1fr}.topbar{flex-direction:column;gap:12px;text-align:center}.topbar-right{justify-content:center;flex-wrap:wrap}.nav-sep{display:none}.main{padding:16px}}
    </style>
</head>
<body>
    <div class="app">
    <header class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
            <h1>Argus 数据看板</h1>
        </div>
        <div class="topbar-right">
            <a href="/" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
                主页
            </a>
            <a href="/static/annotate.html" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                标注
            </a>
            <a href="/static/detect.html" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
                图片检测
            </a>
            <a href="/static/dashboard.html" class="topbar-btn nav-active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                看板
            </a>
            <div class="nav-sep"></div>
            <a href="/static/users.html" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                用户
            </a>
            <a href="/static/logs.html" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                日志
            </a>
            <a href="/static/config.html" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                配置
            </a>
            <div class="nav-sep"></div>
            <a href="/static/training.html" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
                训练
            </a>
            <a href="/static/datasets.html" class="topbar-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                数据集
            </a>
            <button id="themeToggle" class="topbar-btn" onclick="toggleTheme()" style="padding:5px 6px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
            <div id="userInfoSlot"></div>
        </div>
    </header>

    <div class="main">
        <div class="section-header">
            <div class="section-title">概览</div>
            <div style="display:flex;align-items:center;gap:8px">
                <span id="lastUpdate" style="font-size:0.7rem;color:var(--ink-faint)"></span>
                <button class="btn-sm" onclick="exportCSV()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出CSV
                </button>
                <button class="btn-sm" onclick="refreshAll()" id="refreshBtn">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><polyline points="1,20 1,14 7,14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    刷新
                </button>
            </div>
        </div>

        <div class="stats-row" id="statsRow1">
            <div class="stat-card"><div class="stat-label">告警总数</div><div class="stat-value red" id="alarmTotal">-</div><div class="stat-change neutral" id="alarmTotalChange"></div></div>
            <div class="stat-card"><div class="stat-label">今日告警</div><div class="stat-value yellow" id="alarmToday">-</div><div class="stat-change neutral" id="alarmTodayChange"></div></div>
            <div class="stat-card"><div class="stat-label">检测总数</div><div class="stat-value blue" id="detectTotal">-</div></div>
            <div class="stat-card"><div class="stat-label">活跃流</div><div class="stat-value green" id="streamCount">-</div></div>
        </div>

        <div class="stats-row" id="statsRow2">
            <div class="stat-card"><div class="stat-label">用户总数</div><div class="stat-value blue" id="userTotal">-</div></div>
            <div class="stat-card"><div class="stat-label">标注进度</div><div class="stat-value green" id="annotationProgress">-</div><div class="stat-change neutral" id="annotationPct"></div></div>
            <div class="stat-card"><div class="stat-label">数据集</div><div class="stat-value yellow" id="datasetTotal">-</div></div>
            <div class="stat-card"><div class="stat-label">训练任务</div><div class="stat-value blue" id="trainingTotal">-</div><div class="stat-change neutral" id="trainingStatus"></div></div>
        </div>

        <div class="chart-row">
            <div class="chart-box">
                <div class="chart-head">
                    <span>告警趋势</span>
                    <div class="chart-head-right">
                        <div class="range-btns">
                            <button class="range-btn" data-days="7" onclick="setRange(7,this)">7天</button>
                            <button class="range-btn active" data-days="14" onclick="setRange(14,this)">14天</button>
                            <button class="range-btn" data-days="30" onclick="setRange(30,this)">30天</button>
                        </div>
                    </div>
                </div>
                <div class="chart-body">
                    <div class="bar-chart" id="trendChart"><div class="empty-state"><div class="empty-text">加载中...</div></div></div>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-head"><span>告警类型分布</span></div>
                <div class="chart-body">
                    <div class="donut-wrap" id="typeChart"><div class="empty-state"><div class="empty-text">加载中...</div></div></div>
                </div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-box">
                <div class="chart-head"><span>严重级别分布</span></div>
                <div class="chart-body">
                    <div id="severityChart"><div class="empty-state"><div class="empty-text">加载中...</div></div></div>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-head"><span>告警来源 Top 10</span></div>
                <div class="chart-body">
                    <div class="bar-chart" id="streamChart"><div class="empty-state"><div class="empty-text">加载中...</div></div></div>
                </div>
            </div>
        </div>

        <div class="chart-row single">
            <div class="chart-box">
                <div class="chart-head">
                    <span>最近告警</span>
                    <button class="btn-sm" onclick="window.location.href='/'">查看全部</button>
                </div>
                <div style="overflow-x:auto">
                    <table class="alarm-table" id="recentAlarms">
                        <thead><tr>
                            <th></th>
                            <th data-sort="alarm_type" onclick="sortTable('alarm_type',this)">类型 <span class="sort-icon">&#9650;&#9660;</span></th>
                            <th data-sort="stream_id" onclick="sortTable('stream_id',this)">流 ID <span class="sort-icon">&#9650;&#9660;</span></th>
                            <th data-sort="class_name" onclick="sortTable('class_name',this)">类别 <span class="sort-icon">&#9650;&#9660;</span></th>
                            <th data-sort="severity" onclick="sortTable('severity',this)">级别 <span class="sort-icon">&#9650;&#9660;</span></th>
                            <th data-sort="confidence" onclick="sortTable('confidence',this)">置信度 <span class="sort-icon">&#9650;&#9660;</span></th>
                            <th data-sort="detected_at" onclick="sortTable('detected_at',this)">时间 <span class="sort-icon">&#9650;&#9660;</span></th>
                        </tr></thead>
                        <tbody id="alarmTableBody">
                            <tr><td colspan="7"><div class="empty-state" style="padding:32px"><div class="empty-text">加载中...</div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div class="img-preview" id="imgPreview"></div>
    <footer class="footer">Argus 智能监控告警系统 v0.1.0</footer>

    <script src="/static/confirm.js"></script>
    <script src="/static/user-info.js"></script>
    <script>
        const TYPE_NAMES={helmet:'安全帽',fire:'火灾',intrusion:'入侵检测',person:'人',animal:'动物',bird:'鸟',cat:'猫',dog:'狗',smoke:'烟雾',no_helmet:'未戴安全帽'};
        const TYPE_COLORS={helmet:'#0891b2',fire:'#b33a3a',intrusion:'#a67c00',person:'#2d7a4f',animal:'#d97706',bird:'#d97706',cat:'#d97706',dog:'#d97706',smoke:'#e67e22',no_helmet:'#0891b2'};
        const SEVERITY_NAMES={critical:'严重',important:'重要',normal:'一般'};
        const SEVERITY_COLORS={critical:'#dc2626',important:'#d97706',normal:'#a8a29e'};
        let currentDays=14, refreshTimer=null, alarmsData=[], sortKey='detected_at', sortAsc=false;

        function authFetch(url,opts={}){const t=localStorage.getItem('token');if(!opts.headers)opts.headers={};if(t)opts.headers['Authorization']='Bearer '+t;const csrf=document.cookie.match(/csrf_token=([^;]+)/);if(csrf)opts.headers['X-CSRF-Token']=csrf[1];return fetch(url,opts)}
        function doLogout(){localStorage.removeItem('token');localStorage.removeItem('user');fetch('/api/v1/auth/logout',{method:'POST'});window.location.href='/login'}

        function animateValue(el,target){const start=parseInt(el.textContent)||0;if(start===target){el.textContent=target.toLocaleString();return}const duration=500,st=performance.now();(function step(now){const p=Math.min((now-st)/duration,1);el.textContent=Math.round(start+(target-start)*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(step)})(performance.now())}

        function setChangeEl(el,today,yesterday){if(!yesterday||yesterday===0){el.className='stat-change neutral';el.textContent='';return}const d=today-yesterday,p=Math.abs(Math.round((d/yesterday)*100));if(d>0){el.className='stat-change up';el.textContent=`较昨日 +${p}%`}else if(d<0){el.className='stat-change down';el.textContent=`较昨日 -${p}%`}else{el.className='stat-change neutral';el.textContent='与昨日持平'}}

        function exportCSV(){window.open('/api/v1/admin/export/alarms','_blank')}

        async function loadDashboard(){
            try{
                const res=await authFetch('/api/v1/admin/stats/dashboard');
                const d=await res.json();
                if(res.status===401){window.location.href='/login';return}

                animateValue(document.getElementById('alarmTotal'),d.alarm.total);
                animateValue(document.getElementById('alarmToday'),d.alarm.today);
                animateValue(document.getElementById('detectTotal'),d.detection.total);
                if(d.stream)animateValue(document.getElementById('streamCount'),d.stream.active);

                if(d.alarm.trend_7d&&d.alarm.trend_7d.length>=2){
                    const yd=d.alarm.trend_7d[d.alarm.trend_7d.length-2];
                    setChangeEl(document.getElementById('alarmTodayChange'),d.alarm.today,yd?yd.count:0);
                }

                if(d.user)animateValue(document.getElementById('userTotal'),d.user.total);
                if(d.annotation){const dn=d.annotation.completed,tt=d.annotation.total;document.getElementById('annotationProgress').textContent=`${dn} / ${tt}`;if(tt>0){const pct=Math.round((dn/tt)*100);const pe=document.getElementById('annotationPct');pe.textContent=`完成 ${pct}%`;pe.className=pct>=80?'stat-change down':pct>=50?'stat-change neutral':'stat-change up'}}
                if(d.dataset)animateValue(document.getElementById('datasetTotal'),d.dataset.total);
                if(d.training){animateValue(document.getElementById('trainingTotal'),d.training.total);const dist=d.training.status_distribution||{};const r=dist.running||0,c=dist.completed||0;const se=document.getElementById('trainingStatus');if(r>0){se.textContent=`${r} 运行中`;se.className='stat-change up'}else if(c>0){se.textContent=`${c} 已完成`;se.className='stat-change down'}}

                renderTypeChart(d.alarm.type_distribution||{});
                renderSeverityChart(d.alarm.severity_distribution||{});
                renderStreamChart(d.alarm.per_stream_alarm||[]);
            }catch(e){console.error('loadDashboard:',e)}
        }

        function renderTypeChart(dist){
            const entries=Object.entries(dist).sort((a,b)=>b[1]-a[1]);
            const total=entries.reduce((s,e)=>s+e[1],0)||1;
            const el=document.getElementById('typeChart');
            if(!entries.length){el.innerHTML=`<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M9 10h.01M15 10h.01M9.5 15.5a3.5 3.5 0 017 0"/></svg><div class="empty-text">暂无告警数据</div><div class="empty-hint">启动监控后将自动统计</div></div>`;return}
            el.innerHTML=`<svg width="140" height="140" viewBox="0 0 140 140">${entries.reduce((a,[t,c],i)=>{const p=c/total,cl=TYPE_COLORS[t]||'#8a8580',r=60,cx=70,cy=70;let s=-90;for(let j=0;j<i;j++)s+=(entries[j][1]/total)*360;const e=s+p*360,sr=s*Math.PI/180,er=e*Math.PI/180,x1=cx+r*Math.cos(sr),y1=cy+r*Math.sin(sr),x2=cx+r*Math.cos(er),y2=cy+r*Math.sin(er);return a+`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${p>.5?1:0} 1 ${x2},${y2} Z" fill="${cl}" opacity="0.85"><title>${TYPE_NAMES[t]||t}: ${c} (${Math.round(p*100)}%)</title></path>`},'')}<circle cx="70" cy="70" r="35" fill="var(--bg-card-solid)"/><text x="70" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${total}</text><text x="70" y="82" text-anchor="middle" font-size="9" fill="var(--ink-muted)">总计</text></svg><div class="donut-legend">${entries.map(([t,c])=>`<div class="legend-item"><span class="legend-dot" style="background:${TYPE_COLORS[t]||'#8a8580'}"></span><span>${TYPE_NAMES[t]||t}</span><span class="legend-count">${c}</span></div>`).join('')}</div>`;
        }

        function renderSeverityChart(dist){
            const el=document.getElementById('severityChart');
            const entries=Object.entries(dist).sort((a,b)=>{const order={critical:0,important:1,normal:2};return(order[a[0]]||3)-(order[b[0]]||3)});
            const total=entries.reduce((s,e)=>s+e[1],0)||1;
            if(!entries.length){el.innerHTML=`<div class="empty-state"><div class="empty-text">暂无数据</div></div>`;return}
            el.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px;padding:8px 0">${entries.map(([sev,cnt])=>{
                const pct=Math.round((cnt/total)*100);
                const cl=SEVERITY_COLORS[sev]||'#a8a29e';
                return`<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:0.8rem;font-weight:500;display:flex;align-items:center;gap:6px"><span class="severity-badge ${sev}">${SEVERITY_NAMES[sev]||sev}</span></span><span style="font-size:0.78rem;font-family:'JetBrains Mono',monospace;font-weight:600">${cnt} <span style="color:var(--ink-muted);font-weight:400">(${pct}%)</span></span></div><div style="height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${cl};border-radius:4px;transition:width 0.4s ease"></div></div></div>`}).join('')}</div>`;
        }

        function renderStreamChart(data){
            const el=document.getElementById('streamChart');
            if(!data.length){el.innerHTML=`<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><div class="empty-text">暂无数据</div><div class="empty-hint">启动监控后将自动统计</div></div>`;return}
            const maxVal=Math.max(...data.map(d=>d.count),1);
            el.innerHTML=data.map(d=>{
                const h=Math.max(4,(d.count/maxVal)*160);
                return`<div class="bar-col"><div class="bar-tooltip">${d.stream_id}: ${d.count} 次</div><div class="bar-value">${d.count}</div><div class="bar" style="height:${h}px;background:#0891b2"></div><div class="bar-label">${d.stream_id}</div></div>`;
            }).join('');
        }

        async function loadTrend(days){
            currentDays=days;
            try{
                const data=await(await authFetch(`/api/v1/stream/dashboard/trend?days=${days}`)).json();
                const trend=data.trend||[];
                const el=document.getElementById('trendChart');
                if(!trend.length){el.innerHTML=`<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 5-5"/></svg><div class="empty-text">暂无趋势数据</div><div class="empty-hint">启动监控后将自动记录</div></div>`;return}
                const maxVal=Math.max(...trend.map(t=>t.count),1);
                el.innerHTML=trend.map(t=>{const h=Math.max(4,(t.count/maxVal)*160);const day=new Date(t.date).toLocaleDateString('zh-CN',{month:'short',day:'numeric'});return`<div class="bar-col"><div class="bar-tooltip">${day}: ${t.count} 次告警</div><div class="bar-value">${t.count}</div><div class="bar" style="height:${h}px;background:var(--danger)"></div><div class="bar-label">${day}</div></div>`}).join('');
            }catch(e){console.error('loadTrend:',e)}
        }

        function setRange(days,btn){document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadTrend(days)}

        const SEVERITY_ORDER={critical:0,important:1,normal:2};
        function sortTable(key,th){
            if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=key==='confidence'||key==='detected_at'}
            document.querySelectorAll('.alarm-table th').forEach(h=>h.classList.remove('sorted'));
            th.classList.add('sorted');
            th.querySelector('.sort-icon').innerHTML=sortAsc?'&#9650;':'&#9660;';
            renderAlarmTable();
        }
        function renderAlarmTable(){
            const sorted=[...alarmsData].sort((a,b)=>{
                let va=a[sortKey],vb=b[sortKey];
                if(sortKey==='confidence'){va=va||0;vb=vb||0}
                if(sortKey==='severity'){va=SEVERITY_ORDER[va]??3;vb=SEVERITY_ORDER[vb]??3}
                if(sortKey==='detected_at'){va=va||'';vb=vb||''}
                if(typeof va==='string')return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
                return sortAsc?(va||0)-(vb||0):(vb||0)-(va||0);
            });
            const tbody=document.getElementById('alarmTableBody');
            if(!sorted.length){tbody.innerHTML=`<tr><td colspan="7"><div class="empty-state" style="padding:32px"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div class="empty-text">暂无告警记录</div><div class="empty-hint">启动监控后告警将在此展示</div></div></td></tr>`;return}
            tbody.innerHTML=sorted.map(a=>{
                const type=a.alarm_type||'unknown',name=TYPE_NAMES[type]||type;
                const time=a.detected_at?new Date(a.detected_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
                const conf=a.confidence?(a.confidence*100).toFixed(1)+'%':'-';
                const imgSrc=a.image_path?`/api/v1/stream/image/${encodeURIComponent(a.image_path)}`:'';
                const sev=a.severity||'normal';
                const cn=a.class_name||'-';
                return`<tr><td>${imgSrc?`<img class="alarm-thumb" src="${imgSrc}" onerror="this.style.display='none'" loading="lazy" data-full="${imgSrc}" onmouseenter="showPreview(event)" onmouseleave="hidePreview()" alt="">`:''}</td><td><span class="alarm-type-badge ${type}">${name}</span></td><td>${a.stream_id||'-'}</td><td style="font-size:0.76rem">${cn}</td><td><span class="severity-badge ${sev}">${SEVERITY_NAMES[sev]||sev}</span></td><td style="font-family:'JetBrains Mono',monospace">${conf}</td><td class="alarm-time">${time}</td></tr>`;
            }).join('');
        }

        async function loadRecentAlarms(){
            try{
                const data=await(await authFetch('/api/v1/stream/alarms?limit=50')).json();
                alarmsData=data.alarms||[];
                sortKey='detected_at';sortAsc=false;
                document.querySelectorAll('.alarm-table th').forEach(h=>{h.classList.remove('sorted');const si=h.querySelector('.sort-icon');if(si)si.innerHTML='&#9650;&#9660;'});
                renderAlarmTable();
            }catch(e){console.error('loadRecentAlarms:',e)}
        }

        const previewEl=document.getElementById('imgPreview');
        function showPreview(e){
            const src=e.target.dataset.full;if(!src)return;
            previewEl.innerHTML=`<img src="${src}" style="display:block;max-width:320px;max-height:240px;border-radius:var(--radius-md)">`;
            previewEl.style.display='block';
            const r=e.target.getBoundingClientRect();
            let left=r.right+8,top=r.top;
            if(left+330>window.innerWidth)left=r.left-330;
            if(top+250>window.innerHeight)top=window.innerHeight-250;
            if(left<0)left=8;if(top<0)top=8;
            previewEl.style.left=left+'px';previewEl.style.top=top+'px';
        }
        function hidePreview(){previewEl.style.display='none'}

        function updateTimestamp(){const n=new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('lastUpdate').textContent=`更新于 ${n}`}

        async function refreshAll(){
            const btn=document.getElementById('refreshBtn');
            btn.disabled=true;btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 0.8s linear infinite"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg> 刷新中...';
            await Promise.all([loadDashboard(),loadTrend(currentDays),loadRecentAlarms()]);
            updateTimestamp();
            btn.disabled=false;btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><polyline points="1,20 1,14 7,14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg> 刷新';
        }

        refreshAll();
        refreshTimer=setInterval(refreshAll,30000);
    </script>
</body>
</html>
